<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Helvetica, Arial, sans-serif" font-size="16">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000" stroke-width="1.4"/></marker>
</defs>
<rect x="1" y="1" width="998" height="678" rx="12" fill="#dde1ff" stroke="#c9ceee"/>
<text x="30" y="38" font-weight="bold">Architecture — user thread and emulator thread</text>

<!-- Section separators -->
<g stroke="#9aa0cc" stroke-width="1" stroke-dasharray="3 5">
<line x1="20" y1="195" x2="980" y2="195"/><line x1="20" y1="405" x2="980" y2="405"/>
</g>
<g font-size="14" font-weight="bold" fill="#333">
<text x="20" y="118">Launch</text><text x="20" y="215">Asynchronous call</text><text x="20" y="425">Blocking call</text>
</g>

<!-- Lifelines -->
<g stroke="#000" stroke-width="1.4" stroke-dasharray="6 5">
<line x1="180" y1="104" x2="180" y2="660"/><line x1="500" y1="104" x2="500" y2="660"/><line x1="820" y1="176" x2="820" y2="660"/>
</g>

<!-- Participants -->
<g fill="#fdf5e1" stroke="#000" stroke-width="2.4">
<rect x="100" y="60" width="160" height="44" rx="12"/><rect x="420" y="60" width="160" height="44" rx="12"/><rect x="740" y="132" width="160" height="44" rx="12"/>
</g>
<g text-anchor="middle" font-weight="bold">
<text x="180" y="88">User thread</text><text x="500" y="88">Command queue</text><text x="820" y="160">Emulator thread</text>
</g>

<!-- Emulator frames -->
<g fill="#fff" stroke="#000" stroke-width="1.2">
<rect x="812" y="182" width="16" height="108" rx="3"/><rect x="812" y="340" width="16" height="56" rx="3"/><rect x="812" y="410" width="16" height="96" rx="3"/><rect x="812" y="560" width="16" height="90" rx="3"/>
</g>
<g font-size="13" fill="#333" font-style="italic">
<text x="840" y="240">computes frames</text><text x="840" y="372">computes frames</text><text x="840" y="610">computes frames</text>
</g>

<!-- 1. Launch -->
<rect x="174" y="146" width="12" height="16" fill="#fdf5e1" stroke="#000" stroke-width="1.4"/>
<line x1="186" y1="154" x2="738" y2="154" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="460" y="144" text-anchor="middle">launch(listener, process)</text>

<!-- 2. Asynchronous call -->
<rect x="174" y="222" width="12" height="16" fill="#fdf5e1" stroke="#000" stroke-width="1.4"/>
<line x1="186" y1="230" x2="468" y2="230" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="330" y="220" text-anchor="middle">runAsync()</text>
<text x="168" y="252" text-anchor="end" font-size="13" fill="#333" font-style="italic">returns at once</text>
<rect x="470" y="218" width="60" height="26" rx="6" fill="#fdf5e1" stroke="#000" stroke-width="1.8"/>
<text x="500" y="236" text-anchor="middle" font-size="14">RUN</text>

<line x1="500" y1="296" x2="808" y2="296" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="670" y="286" text-anchor="middle">next update cycle</text>
<rect x="812" y="290" width="16" height="44" fill="#fdf5e1" stroke="#000" stroke-width="1.4"/>
<text x="840" y="318" font-size="14">executes RUN</text>

<!-- Message back to the front-end -->
<line x1="808" y1="334" x2="192" y2="334" stroke="#000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="500" y="324" text-anchor="middle">message RUN (process callback)</text>
<rect x="174" y="326" width="12" height="16" fill="#fdf5e1" stroke="#000" stroke-width="1.4"/>

<!-- 3. Blocking call -->
<rect x="174" y="442" width="12" height="148" fill="#c9ceee" stroke="#000" stroke-width="1.4"/>
<text x="168" y="520" text-anchor="end" font-size="13" fill="#333" font-style="italic">waits</text>
<line x1="186" y1="450" x2="468" y2="450" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="330" y="440" text-anchor="middle">powerOff()</text>
<rect x="440" y="438" width="120" height="26" rx="6" fill="#fdf5e1" stroke="#000" stroke-width="1.8"/>
<text x="500" y="456" text-anchor="middle" font-size="14">POWER_OFF</text>

<line x1="500" y1="512" x2="808" y2="512" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="680" y="502" text-anchor="middle">next update cycle</text>
<rect x="812" y="506" width="16" height="48" fill="#fdf5e1" stroke="#000" stroke-width="1.4"/>
<text x="840" y="534" font-size="14">executes POWER_OFF</text>

<line x1="808" y1="574" x2="192" y2="574" stroke="#000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/>
<text paint-order="stroke" stroke="#dde1ff" stroke-width="6" x="500" y="564" text-anchor="middle">return (or CoreError)</text>

<!-- Legend -->
<g font-size="13" fill="#333">
<line x1="30" y1="662" x2="70" y2="662" stroke="#000" stroke-width="1.8" marker-end="url(#a)"/><text x="80" y="667">call, command</text>
<line x1="200" y1="662" x2="240" y2="662" stroke="#000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="250" y="667">return, message</text>
</g>
</svg>
